name: Deploy ScootyBook to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm install

      - name: Install client dependencies
        working-directory: ./client
        run: npm install

      - name: Build React client
        working-directory: ./client
        env:
          REACT_APP_API_URL: https://scootybook.kusalpabasara.me/api
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CI: false
        run: npm run build

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: |
            server.js
            package.json
            package-lock.json
            middleware/
            models/
            routes/
            services/
            config/
          retention-days: 1

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: client/build/
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: ./backend

      - name: Download frontend artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: ./frontend

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 152.42.185.253 >> ~/.ssh/known_hosts

      - name: Deploy backend files
        run: |
          scp -r ./backend/* root@152.42.185.253:/apps/scootybook/
          scp -r ./backend/node_modules root@152.42.185.253:/apps/scootybook/ 2>/dev/null || true

      - name: Deploy frontend files
        run: |
          ssh root@152.42.185.253 'mkdir -p /apps/scootybook/client'
          scp -r ./frontend/* root@152.42.185.253:/apps/scootybook/client/build/

      - name: Install dependencies and restart app
        run: |
          ssh root@152.42.185.253 << 'EOF'
          cd /apps/scootybook
          npm install --production
          pm2 restart scootybook || pm2 start ecosystem.config.js
          pm2 save
          systemctl restart nginx
          echo "✅ Deployment successful!"
          EOF

      - name: Health check
        run: |
          sleep 5
          curl -f https://scootybook.kusalpabasara.me/health || exit 1
          echo "✅ Health check passed!"

      - name: Notify deployment
        if: always()
        run: |
          echo "✅ Deployment completed"
          echo "Application URL: https://scootybook.kusalpabasara.me"
