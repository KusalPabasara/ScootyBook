# Nginx Configuration for ScootyBook
# Place this file at: /etc/nginx/sites-available/scootybook
# Then create symlink: ln -s /etc/nginx/sites-available/scootybook /etc/nginx/sites-enabled/scootybook

upstream scootybook_backend {
    server 127.0.0.1:5001;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name scootybook.kusalpabasara.me www.scootybook.kusalpabasara.me;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scootybook.kusalpabasara.me www.scootybook.kusalpabasara.me;

    # SSL Certificate Paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/scootybook.kusalpabasara.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scootybook.kusalpabasara.me/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/scootybook_access.log combined;
    error_log /var/log/nginx/scootybook_error.log;

    # Client upload limit
    client_max_body_size 50M;

    # Frontend - Static files and SPA routing
    location / {
        root /apps/scootybook/client/build;
        
        # Cache busting for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA routing - serve index.html for all routes
        try_files $uri $uri/ /index.html;
        
        # Prevent caching of index.html
        location = /index.html {
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # API Backend
    location /api/ {
        proxy_pass http://scootybook_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://scootybook_backend;
        proxy_http_version 1.1;
        access_log off;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Redirect www to non-www (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.scootybook.kusalpabasara.me;

    ssl_certificate /etc/letsencrypt/live/scootybook.kusalpabasara.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scootybook.kusalpabasara.me/privkey.pem;

    return 301 https://scootybook.kusalpabasara.me$request_uri;
}
